<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
  <title>Parameters of the symmetric frustum (side view)</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="639" height="299" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="24" y="30" font-size="14" font-weight="600" fill="#24292f">SymmetricFrustum</text>
  <text x="160" y="30" fill="#57606a">side view</text>

  <!-- apex to near (dashed) -->
  <g stroke="#0969da" stroke-width="1" stroke-dasharray="4 3" fill="none">
    <line x1="80" y1="140" x2="200" y2="116"/><line x1="80" y1="140" x2="200" y2="164"/>
  </g>
  <!-- frustum body -->
  <path d="M200 116 L520 52 L520 228 L200 164 Z" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>

  <!-- axes -->
  <line x1="80" y1="140" x2="600" y2="140" stroke="#0969da" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="80" y1="140" x2="80" y2="78" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#a)"/>
  <circle cx="80" cy="140" r="3.5" fill="#24292f"/>
  <text x="72" y="160" fill="#24292f" text-anchor="end">origin</text>
  <text x="622" y="128" fill="#0969da" text-anchor="end">basis Z</text>
  <text x="622" y="158" fill="#57606a" font-size="11" text-anchor="end">view direction</text>
  <text x="88" y="78" fill="#1a7f37">basis Y</text>

  <!-- half dims at near -->
  <line x1="200" y1="140" x2="200" y2="116" stroke="#cf222e" stroke-width="2"/>
  <text x="196" y="102" fill="#cf222e" text-anchor="end">halfDims.y</text>
  <!-- base half dims at far -->
  <line x1="520" y1="140" x2="520" y2="52" stroke="#8250df" stroke-width="2"/>
  <text x="512" y="44" fill="#8250df" text-anchor="end">getBaseHalfDimensions().y</text>

  <text x="196" y="182" fill="#57606a" text-anchor="end" font-size="11">near</text>
  <text x="528" y="232" fill="#57606a" font-size="11">far</text>

  <!-- depth dimensions -->
  <g stroke="#57606a" stroke-width="1" fill="none">
    <line x1="80" y1="150" x2="80" y2="276"/><line x1="200" y1="170" x2="200" y2="254"/><line x1="520" y1="234" x2="520" y2="276"/>
    <line x1="82" y1="248" x2="198" y2="248" marker-start="url(#d)" marker-end="url(#d)"/>
    <line x1="82" y1="270" x2="518" y2="270" marker-start="url(#d)" marker-end="url(#d)"/>
  </g>
  <text x="140" y="243" fill="#57606a" text-anchor="middle">depthRange.minimum</text>
  <text x="330" y="265" fill="#57606a" text-anchor="middle">depthRange.maximum</text>
</svg>
