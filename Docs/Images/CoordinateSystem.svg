<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>Coordinate system and yaw, pitch and roll</title>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker>
    <marker id="rot" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8250df"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="519" height="279" rx="8" fill="#ffffff" stroke="#d0d7de"/>

  <!-- axes -->
  <g stroke-width="2.5" fill="none" stroke-linecap="round">
    <line x1="150" y1="200" x2="296" y2="200" stroke="#cf222e" marker-end="url(#ax)"/>
    <line x1="150" y1="200" x2="150" y2="50" stroke="#1a7f37" marker-end="url(#ax)"/>
    <line x1="150" y1="200" x2="246" y2="128" stroke="#0969da" marker-end="url(#ax)"/>
  </g>
  <circle cx="150" cy="200" r="3.5" fill="#24292f"/>

  <g font-weight="600">
    <text x="304" y="205" fill="#cf222e">X</text>
    <text x="145" y="40" fill="#1a7f37">Y</text>
    <text x="252" y="124" fill="#0969da">Z</text>
  </g>
  <g fill="#57606a" font-size="12">
    <text x="318" y="205">right</text>
    <text x="160" y="40">up</text>
    <text x="266" y="124">forward</text>
  </g>

  <!-- rotation arrows -->
  <g fill="none" stroke="#8250df" stroke-width="1.8">
    <!-- yaw about Y: Z toward X -->
    <path d="M 132 94 A 24 9 0 0 1 174 96" marker-end="url(#rot)"/>
    <!-- pitch about X: Y toward Z -->
    <path d="M 236 180 A 9 22 0 0 1 244 212" marker-end="url(#rot)"/>
    <!-- roll about Z: X toward Y -->
    <path d="M 222 166 A 20 20 0 0 0 190 150" marker-end="url(#rot)"/>
  </g>
  <g fill="#8250df" font-size="12" font-weight="600">
    <text x="92" y="98">yaw</text>
    <text x="226" y="236">pitch</text>
    <text x="176" y="136">roll</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#24292f">
    <text x="372" y="62" font-weight="600" font-size="13">Left-handed</text>
    <text x="372" y="82" fill="#57606a">Angles in radians</text>
    <line x1="372" y1="96" x2="496" y2="96" stroke="#d0d7de"/>
    <text x="372" y="118"><tspan font-weight="600" fill="#8250df">yaw</tspan>   about Y</text>
    <text x="372" y="136" fill="#57606a">+Z turns toward +X</text>
    <text x="372" y="162"><tspan font-weight="600" fill="#8250df">pitch</tspan>   about X</text>
    <text x="372" y="180" fill="#57606a">+Z turns toward −Y</text>
    <text x="372" y="206"><tspan font-weight="600" fill="#8250df">roll</tspan>   about Z</text>
    <text x="372" y="224" fill="#57606a">+X turns toward +Y</text>
  </g>
</svg>
