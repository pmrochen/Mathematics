<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
  <title>Parameters of the cylinder, capsule, cone and torus</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="759" height="269" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <g stroke="#d0d7de"><line x1="190" y1="16" x2="190" y2="254"/><line x1="380" y1="16" x2="380" y2="254"/><line x1="570" y1="16" x2="570" y2="254"/></g>
  <g font-size="14" font-weight="600" fill="#24292f" text-anchor="middle">
    <text x="95" y="32">Cylinder</text><text x="285" y="32">Capsule</text><text x="475" y="32">Cone</text><text x="665" y="32">Torus</text>
  </g>

  <!-- Cylinder -->
  <g transform="translate(0,0)">
    <path d="M60 80 L60 200 A40 12 0 0 0 140 200 L140 80" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
    <ellipse cx="100" cy="80" rx="40" ry="12" fill="#f6fbff" stroke="#0969da" stroke-width="1.5"/>
    <path d="M60 200 A40 12 0 0 1 140 200" fill="none" stroke="#0969da" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="100" y1="140" x2="100" y2="58" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#a)"/>
    <circle cx="100" cy="140" r="3" fill="#24292f"/>
    <line x1="100" y1="80" x2="140" y2="80" stroke="#cf222e" stroke-width="1.5"/>
    <g stroke="#57606a" stroke-width="1" fill="none"><line x1="44" y1="82" x2="44" y2="198" marker-start="url(#d)" marker-end="url(#d)"/><line x1="38" y1="80" x2="56" y2="80"/><line x1="38" y1="200" x2="56" y2="200"/></g>
    <text x="106" y="144" fill="#24292f">center</text>
    <text x="106" y="62" fill="#1a7f37">axis</text>
    <text x="121" y="106" fill="#cf222e" text-anchor="middle" font-size="11">radius</text>
    <text x="34" y="144" fill="#57606a" text-anchor="middle" transform="rotate(-90 34 144)">height</text>
  </g>

  <!-- Capsule -->
  <g transform="translate(190,0)">
    <path d="M60 100 A40 40 0 0 1 140 100 L140 180 A40 40 0 0 1 60 180 Z" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
    <g stroke="#0969da" stroke-width="1" stroke-dasharray="3 3" fill="none"><line x1="60" y1="100" x2="140" y2="100"/><line x1="60" y1="180" x2="140" y2="180"/></g>
    <line x1="100" y1="140" x2="100" y2="52" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#a)"/>
    <circle cx="100" cy="140" r="3" fill="#24292f"/>
    <line x1="100" y1="180" x2="128" y2="208" stroke="#cf222e" stroke-width="1.5"/>
    <g stroke="#57606a" stroke-width="1" fill="none"><line x1="44" y1="102" x2="44" y2="178" marker-start="url(#d)" marker-end="url(#d)"/><line x1="38" y1="100" x2="56" y2="100"/><line x1="38" y1="180" x2="56" y2="180"/>
      <line x1="158" y1="62" x2="158" y2="218" marker-start="url(#d)" marker-end="url(#d)"/><line x1="146" y1="60" x2="164" y2="60"/><line x1="146" y1="220" x2="164" y2="220"/></g>
    <text x="106" y="144" fill="#24292f">center</text>
    <text x="106" y="56" fill="#1a7f37">axis</text>
    <text x="104" y="204" fill="#cf222e" text-anchor="middle" font-size="11">radius</text>
    <text x="34" y="140" fill="#57606a" text-anchor="middle" transform="rotate(-90 34 140)">height</text>
    <text x="174" y="140" fill="#57606a" text-anchor="middle" transform="rotate(-90 174 140)">total height</text>
  </g>

  <!-- Cone -->
  <g transform="translate(380,0)">
    <path d="M100 70 L52 200 A48 13 0 0 0 148 200 Z" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
    <path d="M52 200 A48 13 0 0 1 148 200" fill="none" stroke="#0969da" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="100" y1="70" x2="100" y2="166" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#a)"/>
    <line x1="100" y1="166" x2="100" y2="200" stroke="#1a7f37" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="100" cy="70" r="3" fill="#24292f"/>
    <line x1="100" y1="200" x2="148" y2="200" stroke="#cf222e" stroke-width="1.5"/>
    <path d="M100 104 A34 34 0 0 0 111.8 101.9" fill="none" stroke="#8250df" stroke-width="1.5"/>
    <g stroke="#57606a" stroke-width="1" fill="none"><line x1="36" y1="72" x2="36" y2="198" marker-start="url(#d)" marker-end="url(#d)"/><line x1="30" y1="70" x2="96" y2="70"/><line x1="30" y1="200" x2="48" y2="200"/></g>
    <text x="108" y="66" fill="#24292f">vertex</text>
    <text x="84" y="150" fill="#1a7f37" text-anchor="end">axis</text>
    <text x="124" y="195" fill="#cf222e" text-anchor="middle" font-size="11">radius</text>
    <text x="116" y="120" fill="#8250df" font-size="11">half angle</text>
    <text x="26" y="140" fill="#57606a" text-anchor="middle" transform="rotate(-90 26 140)">height</text>
  </g>

  <!-- Torus (cross-section) -->
  <g transform="translate(570,0)">
    <ellipse cx="95" cy="150" rx="74" ry="26" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
    <ellipse cx="95" cy="147" rx="30" ry="8" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
    <circle cx="147" cy="150" r="22" fill="none" stroke="#0969da" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="95" y1="150" x2="95" y2="74" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#a)"/>
    <circle cx="95" cy="150" r="3" fill="#24292f"/>
    <line x1="95" y1="150" x2="147" y2="150" stroke="#cf222e" stroke-width="1.5"/>
    <line x1="147" y1="150" x2="162.6" y2="165.6" stroke="#8250df" stroke-width="1.5"/>
    <circle cx="147" cy="150" r="2" fill="#24292f"/>
    <text x="89" y="166" fill="#24292f" text-anchor="end">center</text>
    <text x="101" y="78" fill="#1a7f37">axis</text>
    <text x="121" y="200" fill="#cf222e" text-anchor="middle" font-size="11">majorRadius</text>
    <line x1="121" y1="189" x2="121" y2="153" stroke="#cf222e" stroke-width="0.8"/>
    <text x="150" y="222" fill="#8250df" text-anchor="middle" font-size="11">minorRadius</text>
    <line x1="156" y1="211" x2="156" y2="162" stroke="#8250df" stroke-width="0.8"/>
  </g>
</svg>
